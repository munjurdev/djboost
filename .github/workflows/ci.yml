name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest flake8 black isort

      - name: Check code formatting (Black)
        run: black --check djboost/

      - name: Check import sorting (isort)
        run: isort --check-only djboost/

      - name: Lint (Flake8)
        run: flake8 djboost/ --max-line-length=120 --ignore=E501,W503,W293,E741,F401,F521,F541,F841

      - name: Run tests
        run: pytest tests/ -v

      - name: Verify all files compile
        run: |
          python -c "
          import py_compile
          import glob
          errors = []
          for f in glob.glob('djboost/**/*.py', recursive=True):
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              for e in errors:
                  print(e)
              exit(1)
          print('All files compile successfully!')
          "

      - name: Verify CLI loads
        run: python -c "from djboost.cli import app; print('CLI loaded successfully')"
