[project]
name = "djboost"
version = "0.8.0"
description = "The modern lifecycle CLI for Django — create, build, extend, validate, and maintain. Safely evolve your project with modular features. djboost gives you a production-ready Django foundation in seconds — DRF, JWT, testing, and more. Build incrementally, ship confidently."
readme = "README.md"
requires-python = ">=3.10,<4"
license = { text = "MIT" }

authors = [
    { name = "Munjur Alom", email = "munjuralom.devs@gmail.com" }
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0"
]

keywords = ["django", "cli", "scaffolding", "boilerplate", "generator", "drf", "rest-api", "docker", "celery", "channels", "websocket", "jwt", "swagger", "production"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/munjurdev/djboost"
Repository = "https://github.com/munjurdev/djboost"
"Bug Tracker" = "https://github.com/munjurdev/djboost/issues"

[project.scripts]
djboost = "djboost.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["djboost*"]

[tool.setuptools.package-data]
djboost = ["py.typed"]

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py310", "py311", "py312", "py313"]
line-length = 120

[tool.flake8]
max-line-length = 120
ignore = ["E501", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]